inicio.actividades=Actos de Cuaresma 2027
inicio.boton=Prepara tu visita

# Concierto de la Banda Municipal
actividad.banda.titulo=Concierto de la Banda Municipal
actividad.banda.descripcion=Disfruta de una tarde de música cofrade en la plaza de la Soledad. La Banda Municipal de Morón interpretará marchas procesionales para ir creando el ambiente de nuestra Semana Santa y disfrutar de una de las tradiciones más especiales de nuestro pueblo.
actividad.banda.dato=Sábado, 13 de febrero de 2027 | 20:00 | Plaza de la Soledad

# Visita guiada a San Miguel
actividad.sanmiguel.titulo=Visita guiada a San Miguel
actividad.sanmiguel.descripcion=Conoce la iglesia de San Miguel a través de una visita guiada en la que podremos descubrir su historia, su patrimonio y algunos de los detalles que forman parte de la tradición religiosa de Morón. Una oportunidad para acercarnos a uno de los lugares más representativos de nuestro pueblo.
actividad.sanmiguel.dato=Domingo, 28 de febrero de 2027 | 11:00 | Iglesia de San Miguel

# Exposicion de Santa Clara
actividad.santaclara.titulo=Exposición de la Hermandad de San Francisco
actividad.santaclara.descripcion=Acércate al convento de Santa Clara para conocer la exposición organizada por la Hermandad de San Francisco. Una oportunidad para descubrir parte de su historia, su patrimonio y la tradición cofrade que se vive en Morón durante los días previos a la Semana Santa.
actividad.santaclara.dato=Sábado, 13 de marzo de 2027 | 18:00 | Santa Clara

# Pagina de visita
visita.titulo=Prepara tu visita
visita.subtitulo=Todo lo que necesitas para disfrutar de los actos de Cuaresma en Morón.

visita.horario.titulo=Consulta los horarios
visita.horario.texto=El concierto será el 13 de febrero a las 20:00, la visita guiada a San Miguel tendrá lugar el 28 de febrero a las 11:00 y la exposición de Santa Clara se podrá visitar el 13 de marzo a las 18:00. Estas fechas y horarios son orientativos para esta propuesta.

visita.entradas.titulo=Acceso a los actos
visita.entradas.texto=Consulta si cada actividad necesita inscripción previa o tiene alguna condición de acceso. Así podrás disfrutar de los actos sin imprevistos.

visita.llegar.titulo=Lugares que visitar
visita.llegar.texto=Los actos tendrán lugar en distintos espacios de Morón, como la plaza de la Soledad, la iglesia de San Miguel y Santa Clara. Organiza el recorrido teniendo en cuenta la ubicación de cada lugar.

visita.accesibilidad.titulo=Respeto por nuestro patrimonio
visita.accesibilidad.texto=Durante las visitas a iglesias y espacios históricos, sigue las indicaciones de la organización y respeta los lugares que forman parte de la historia y las tradiciones de nuestro pueblo.

visita.volver=Volver a los actos