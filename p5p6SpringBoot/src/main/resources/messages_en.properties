# Municipal Band concert
actividad.banda.titulo=Municipal Band Concert
actividad.banda.descripcion=Enjoy an afternoon of religious music in Plaza de la Soledad. The Municipal Band of Morón will perform processional marches to help create the atmosphere of Holy Week and celebrate one of the most special traditions in our town.
actividad.banda.dato=Saturday, February 13, 2027 | 20:00 | Plaza de la Soledad

# Guided visit to San Miguel
actividad.sanmiguel.titulo=Guided Visit to San Miguel
actividad.sanmiguel.descripcion=Discover the Church of San Miguel through a guided visit where we can learn about its history, artistic heritage and some of the details connected to Morón's religious traditions. An opportunity to explore one of the most representative places in our town.
actividad.sanmiguel.dato=Sunday, February 28, 2027 | 11:00 | Church of San Miguel

# Santa Clara exhibition
actividad.santaclara.titulo=San Francisco Brotherhood Exhibition
actividad.santaclara.descripcion=Visit the Santa Clara convent to discover the exhibition organised by the San Francisco Brotherhood. An opportunity to learn about its history, heritage and the religious traditions that are part of life in Morón in the days leading up to Holy Week.
actividad.santaclara.dato=Saturday, March 13, 2027 | 18:00 | Santa Clara

# Visit page
visita.titulo=Plan your visit
visita.subtitulo=Everything you need to enjoy the Lenten events in Morón.

visita.horario.titulo=Check the schedule
visita.horario.texto=The concert will take place on February 13 at 20:00, the guided visit to San Miguel on February 28 at 11:00, and the Santa Clara exhibition on March 13 at 18:00. These dates and times are proposed for this project.

visita.entradas.titulo=Access to the events
visita.entradas.texto=Check whether each activity requires advance registration or has any access requirements. This will help you enjoy the events without any surprises.

visita.llegar.titulo=Places to visit
visita.llegar.texto=The events will take place at different locations in Morón, including Plaza de la Soledad, the Church of San Miguel and Santa Clara. Plan your route according to the location of each venue.

visita.accesibilidad.titulo=Respect for our heritage
visita.accesibilidad.texto=When visiting churches and historic places, follow the organisers' instructions and respect the spaces that are part of our town's history and traditions.

visita.volver=Back to the events