# Work experience
cv.experiencia.1.puesto=Work Placement
cv.experiencia.1.descripcion=I completed a work placement at Colegio La Inmaculada in Morón de la Frontera as part of my intermediate vocational training in IT. My tasks included repairing, installing, assembling and maintaining computer equipment. I also assisted with computer science and robotics classes.
cv.experiencia.2.puesto=Work Placement
cv.experiencia.2.descripcion=I completed a work placement at Plug Connect in Morón de la Frontera during the first year of my Multiplatform Application Development course. I took part in a group project to develop a website for employee clock-in and registration, applying my knowledge of programming, databases and web design.
cv.experiencia.3.puesto=Letter and Leaflet Distributor
cv.experiencia.3.empresa=Family Business and Brotherhood of Jesús Nazareno
cv.experiencia.3.descripcion=I distributed letters, leaflets and newsletters for a family business. I also volunteered as a member of the Youth Group of the Brotherhood of Jesús Nazareno in Morón de la Frontera, distributing the brotherhood's newsletters and correspondence.
