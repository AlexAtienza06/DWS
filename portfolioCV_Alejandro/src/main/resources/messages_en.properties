portfolio.proyecto1.titulo=Employee attendance website
portfolio.proyecto1.descripcion=Group project to develop a website for registering and managing employee attendance at Plug Connect. Programming, database and web design knowledge were applied.
portfolio.proyecto2.titulo=Website dedicated to a singer
portfolio.proyecto2.descripcion=Creation and maintenance of a website dedicated to a singer using WordPress. The project involved content management, design customization and information organization.
portfolio.proyecto3.titulo=Maker classroom equipment loan system
portfolio.proyecto3.descripcion=Web application developed with Java and Thymeleaf to manage equipment loans in the maker classroom. It allows users to register requests and manage information through Spring MVC.
portfolio.proyecto4.titulo=My study plan
portfolio.proyecto4.descripcion=Web application that displays a personalized study plan. Spring MVC controllers and Thymeleaf templates are used to present the information.
portfolio.proyecto5.titulo=Young Group Website of the Brotherhood of Jesus of Nazareth
portfolio.proyecto5.descripcion=Development of a website to facilitate information and organization for the Young Group. It includes a public section with information, a calendar and a product catalogue, as well as a private area to manage shifts, activities, attendance, proposals, sales and users.

