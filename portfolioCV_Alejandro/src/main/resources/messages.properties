# Experiencia laboral
cv.experiencia.1.puesto=Formación en Centros de Trabajo
cv.experiencia.1.descripcion=Realicé prácticas en el Colegio La Inmaculada de Morón de la Frontera durante mi formación en el grado medio de informática. Allí llevé a cabo reparaciones, instalaciones, montajes y mantenimientos de dispositivos informáticos. También colaboré como ayudante en las clases de informática y robótica.

cv.experiencia.2.puesto=Formación en Centros de Trabajo
cv.experiencia.2.descripcion=Realicé prácticas en la empresa Plug Connect de Morón de la Frontera durante el primer curso de Desarrollo de Aplicaciones Multiplataforma. Participé en un proyecto grupal para desarrollar una web de fichaje y registro de empleados, aplicando conocimientos de programación, bases de datos y diseño web.

cv.experiencia.3.puesto=Repartidor de cartas y folletos
cv.experiencia.3.empresa=Empresa familiar y Hermandad de Jesús Nazareno
cv.experiencia.3.descripcion=Realicé tareas de reparto de cartas, folletos y boletines en una empresa familiar. También colaboré voluntariamente como miembro del Grupo Joven de la Hermandad de Jesús Nazareno de Morón de la Frontera, repartiendo boletines y correspondencia de la hermandad.

