portfolio.proyecto1.titulo=Web de fichaje de empleados
portfolio.proyecto1.descripcion=Desarrollo grupal de una página web para registrar y controlar el fichaje de los empleados de la empresa Plug Connect. Se aplicaron conocimientos de programación, bases de datos y diseño web.
portfolio.proyecto2.titulo=Web dedicada a un cantante
portfolio.proyecto2.descripcion=Creación y mantenimiento de una página web dedicada a un cantante, utilizando WordPress. El proyecto permitió trabajar con la gestión de contenidos, la personalización del diseño y la organización de la información.
portfolio.proyecto3.titulo=Préstamo de material del aula maker
portfolio.proyecto3.descripcion=Aplicación web desarrollada con Java y Thymeleaf para gestionar el préstamo de material del aula maker. Permite registrar solicitudes y trabajar con los datos mediante Spring MVC.
portfolio.proyecto4.titulo=Mi plan de estudio
portfolio.proyecto4.descripcion=Aplicación web que permite mostrar un plan de estudio personalizado. Se utilizan controladores Spring MVC y plantillas Thymeleaf para presentar la información.
portfolio.proyecto5.titulo=Web del Grupo Joven de la Hermandad de Jesús Nazareno
portfolio.proyecto5.descripcion=Desarrollo de una página web para facilitar la información y organización del Grupo Joven. Incluye una parte pública con información, calendario y catálogo de productos, además de un espacio privado para gestionar turnos, actividades, asistencias, propuestas, ventas y usuarios.

